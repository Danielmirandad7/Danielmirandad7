<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Óculos seguindo rosto (FaceMesh clássico)</title>

  <!-- MediaPipe FaceMesh clássico (mais compatível iOS) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;}
    #wrap{position:fixed;inset:0;background:#000;}
    video,canvas{
      position:absolute;inset:0;width:100vw;height:100vh;object-fit:cover;
      transform:scaleX(-1); /* selfie espelhada */
    }
    #ui{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:10px;background:rgba(0,0,0,.85);z-index:10;color:#fff;
      font-family:system-ui,sans-serif;text-align:center;padding:20px;
    }
    #startBtn{
      font-size:18px;padding:12px 18px;border-radius:10px;border:none;
      background:#fff;color:#000;font-weight:700;
    }
    #msg{font-size:14px;opacity:.85;max-width:90vw;}
  </style>
</head>
<body>
  <div id="wrap">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="ui">
    <button id="startBtn">Ativar câmera</button>
    <div id="msg">Permita a câmera. O óculos vai seguir seus olhos.</div>
  </div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const msg = document.getElementById("msg");

    let glassesReady = false;

    // óculos simples embutido em SVG
    const glassesImg = new Image();
    const glassesSVG = `
      <svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
        <g fill="none" stroke="#ff2d2d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
          <rect x="40" y="40" width="210" height="140" rx="60"/>
          <rect x="350" y="40" width="210" height="140" rx="60"/>
          <path d="M250 110 L350 110"/>
          <path d="M40 90 L5 70"/>
          <path d="M560 90 L595 70"/>
        </g>
      </svg>`;
    glassesImg.onload = () => glassesReady = true;
    glassesImg.src = "data:image/svg+xml;utf8," + encodeURIComponent(glassesSVG);

    function fitCanvas() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (vw && vh && (canvas.width !== vw || canvas.height !== vh)) {
        canvas.width = vw;
        canvas.height = vh;
      }
    }

    function drawGlasses(landmarks){
      if(!glassesReady) return;

      // FaceMesh usa a mesma numeração: 33 e 263 = cantos externos dos olhos
      const leftEye  = landmarks[33];
      const rightEye = landmarks[263];

      const w = canvas.width, h = canvas.height;
      const lx = leftEye.x * w, ly = leftEye.y * h;
      const rx = rightEye.x * w, ry = rightEye.y * h;

      const cx = (lx + rx) / 2;
      const cy = (ly + ry) / 2;

      const dx = rx - lx, dy = ry - ly;
      const dist = Math.hypot(dx, dy);
      const ang = Math.atan2(dy, dx);

      const gW = dist * 2.2;
      const gH = gW * (220/600);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(ang);
      ctx.drawImage(glassesImg, -gW/2, -gH/2, gW, gH);
      ctx.restore();
    }

    startBtn.addEventListener("click", async () => {
      msg.textContent = "Iniciando...";
      try {
        // cria FaceMesh
        const faceMesh = new FaceMesh({
          locateFile: (file) =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`
        });

        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        faceMesh.onResults((results) => {
          fitCanvas();
          ctx.clearRect(0,0,canvas.width,canvas.height);

          if (results.multiFaceLandmarks && results.multiFaceLandmarks.length) {
            drawGlasses(results.multiFaceLandmarks[0]);
          } else {
            // debug simples
            ctx.font = "20px system-ui";
            ctx.fillStyle = "white";
            ctx.fillText("Rosto não detectado", 20, 40);
          }
        });

        // inicia câmera com camera_utils (padrão MediaPipe) :contentReference[oaicite:1]{index=1}
        const camera = new Camera(video, {
          onFrame: async () => {
            await faceMesh.send({ image: video });
          },
          width: 1280,
          height: 720,
          facingMode: "user"
        });

        await camera.start();
        ui.style.display = "none";

      } catch (e) {
        console.error(e);
        msg.textContent = "Falhou. Confere permissão/HTTPS.";
      }
    });
  </script>
</body>
</html>
