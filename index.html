<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Óculos seguindo rosto (Jeeliz)</title>

  <!-- Jeeliz hospedado oficialmente (já inclui NN_DEFAULT.json no mesmo path) -->
  <script src="https://appstatic.jeeliz.com/faceFilter/jeelizFaceFilter.js"></script>
  <script src="https://appstatic.jeeliz.com/faceFilter/JeelizResizer.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;}
    #wrap{position:fixed;inset:0;background:#000;}
    canvas{
      position:absolute;inset:0;width:100vw;height:100vh;object-fit:cover;
      transform: scaleX(-1); /* selfie espelhada */
    }
    #overlayCanvas{pointer-events:none;}
    #ui{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:10px;background:rgba(0,0,0,.85);z-index:10;color:#fff;
      font-family:system-ui,sans-serif;text-align:center;padding:20px;
    }
    #startBtn{
      font-size:18px;padding:12px 18px;border-radius:10px;border:none;
      background:#fff;color:#000;font-weight:700;
    }
    #msg{font-size:14px;opacity:.85;max-width:90vw;}
  </style>
</head>
<body>
  <div id="wrap">
    <!-- Canvas do Jeeliz (vídeo + tracking) -->
    <canvas id="jeeFaceFilterCanvas"></canvas>
    <!-- Canvas 2D por cima (óculos) -->
    <canvas id="overlayCanvas"></canvas>
  </div>

  <div id="ui">
    <button id="startBtn">Ativar câmera</button>
    <div id="msg">Permita a câmera. O óculos vai seguir seu rosto.</div>
  </div>

  <script>
    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const msg = document.getElementById("msg");

    const overlay = document.getElementById("overlayCanvas");
    const octx = overlay.getContext("2d");

    // óculos simples embutido em SVG
    let glassesReady = false;
    const glassesImg = new Image();
    const glassesSVG = `
      <svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
        <g fill="none" stroke="#ff2d2d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
          <rect x="40" y="40" width="210" height="140" rx="60"/>
          <rect x="350" y="40" width="210" height="140" rx="60"/>
          <path d="M250 110 L350 110"/>
          <path d="M40 90 L5 70"/>
          <path d="M560 90 L595 70"/>
        </g>
      </svg>`;
    glassesImg.onload = () => glassesReady = true;
    glassesImg.src = "data:image/svg+xml;utf8," + encodeURIComponent(glassesSVG);

    function fitOverlayToJeeliz() {
      const jee = document.getElementById("jeeFaceFilterCanvas");
      if (overlay.width !== jee.width || overlay.height !== jee.height) {
        overlay.width = jee.width;
        overlay.height = jee.height;
      }
    }

    function drawGlasses(detectState){
      fitOverlayToJeeliz();
      octx.clearRect(0,0,overlay.width,overlay.height);

      if (!glassesReady || detectState.detected < 0.6) {
        octx.font = "20px system-ui";
        octx.fillStyle = "white";
        octx.fillText("Procurando rosto...", 20, 40);
        return;
      }

      const cw = overlay.width, ch = overlay.height;
      const halfW = cw/2, halfH = ch/2;

      // Jeeliz retorna centro do rosto em -1..1
      const cx = detectState.x * halfW + halfW;
      const cy = detectState.y * halfH + halfH;

      // escala aproximada do rosto (s)
      const gW = detectState.s * cw * 2.2;
      const gH = gW * (220/600);

      // rotação Z (inclinação da cabeça)
      const ang = detectState.rz || 0;

      octx.save();
      octx.translate(cx, cy - gH*0.1); // sobe um pouco p/ alinhar nos olhos
      octx.rotate(ang);
      octx.drawImage(glassesImg, -gW/2, -gH/2, gW, gH);
      octx.restore();
    }

    startBtn.addEventListener("click", () => {
      msg.textContent = "Iniciando...";

      // Jeeliz recomenda usar o Resizer para melhor resolução no mobile :contentReference[oaicite:2]{index=2}
      JeelizResizer.size_canvas({
        canvasId: "jeeFaceFilterCanvas",
        callback: function(isError, bestVideoSettings){
          if (isError){
            msg.textContent = "Erro ao iniciar câmera.";
            return;
          }

          JEELIZFACEFILTER.init({
            canvasId: "jeeFaceFilterCanvas",
            NNCPath: "https://appstatic.jeeliz.com/faceFilter/", // modelo NN_DEFAULT.json
            videoSettings: bestVideoSettings,
            callbackReady: function(errCode, spec){
              if (errCode){
                console.log("Jeeliz erro:", errCode);
                msg.textContent = "Falhou no iPhone (WebGL).";
                return;
              }
              ui.style.display = "none";
            },
            callbackTrack: function(detectState){
              drawGlasses(detectState); // detectState tem x,y,s,rz e detected :contentReference[oaicite:3]{index=3}
            }
          });
        }
      });
    });
  </script>
</body>
</html>
