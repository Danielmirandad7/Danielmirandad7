<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Filtro Óculos - Teste Simples</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; }

    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items:center; justify-content:center;
      background:#000;
    }

    video, canvas {
      position: absolute; inset:0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      /* espelha para selfie */
      transform: scaleX(-1);
    }

    #ui {
      position: fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      background: rgba(0,0,0,0.85);
      z-index: 10;
      color:#fff; font-family: system-ui, sans-serif;
      flex-direction: column; gap: 12px;
      text-align:center;
      padding: 20px;
    }
    #startBtn {
      font-size: 18px; padding: 12px 18px; border-radius: 10px;
      border: none; background: #fff; color:#000; font-weight:700;
    }
    #hint { font-size: 14px; opacity:.8; }
  </style>
</head>
<body>
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="ui">
    <button id="startBtn">Ativar câmera</button>
    <div id="hint">Permita o acesso à câmera. O óculos vai seguir seu rosto.</div>
  </div>

  <script type="module">
    import vision from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";
    const { FaceLandmarker, FilesetResolver } = vision;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");

    let faceLandmarker = null;
    let running = false;

    // óculos simples em SVG (sem arquivo externo)
    const glassesImg = new Image();
    const glassesSVG = `
      <svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
        <g fill="none" stroke="#ff2d2d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
          <rect x="40" y="40" width="210" height="140" rx="60"/>
          <rect x="350" y="40" width="210" height="140" rx="60"/>
          <path d="M250 110 L350 110"/>
          <path d="M40 90 L5 70"/>
          <path d="M560 90 L595 70"/>
        </g>
      </svg>`;
    glassesImg.src = "data:image/svg+xml;utf8," + encodeURIComponent(glassesSVG);

    async function initLandmarker() {
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    function drawGlasses(landmarks) {
      // Índices clássicos do FaceMesh:
      // 33 = canto externo do olho esquerdo, 263 = canto externo do olho direito
      const leftEye = landmarks[33];
      const rightEye = landmarks[263];

      const w = canvas.width;
      const h = canvas.height;

      const lx = leftEye.x * w;
      const ly = leftEye.y * h;
      const rx = rightEye.x * w;
      const ry = rightEye.y * h;

      const cx = (lx + rx) / 2;
      const cy = (ly + ry) / 2;

      const dx = rx - lx;
      const dy = ry - ly;
      const eyeDist = Math.hypot(dx, dy);

      const angle = Math.atan2(dy, dx);

      // escala do óculos baseada na distância entre os olhos
      const glassesW = eyeDist * 2.2;
      const glassesH = glassesW * (220/600);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.drawImage(glassesImg, -glassesW/2, -glassesH/2, glassesW, glassesH);
      ctx.restore();
    }

    let lastTime = 0;
    async function loop() {
      if (!running) return;

      const now = performance.now();
      if (video.readyState >= 2 && faceLandmarker) {
        const res = faceLandmarker.detectForVideo(video, now);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (res.faceLandmarks && res.faceLandmarks.length) {
          drawGlasses(res.faceLandmarks[0]);
        }
      }

      lastTime = now;
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", async () => {
      try {
        ui.style.display = "none";
        await initLandmarker();   // MediaPipe Tasks via CDN + modelo .task :contentReference[oaicite:0]{index=0}
        await startCamera();
        running = true;
        loop();
      } catch (e) {
        console.error(e);
        ui.style.display = "flex";
        document.getElementById("hint").textContent =
          "Erro ao abrir câmera/modelo. Abra em HTTPS e permita a câmera.";
      }
    });
  </script>
</body>
</html>
